   shapes.push({t:'ell',z,cx:R+off+(i%2?sl:-sl)+mxx*k+so[0],cy:R+y*S+myy*k+so[1],L:S*0.72,W:S*0.27+i*8,ang:0});});
 }
 if(aod){
  shapes.filter(s=>!s.z).forEach((s,i)=>aodShape(s,i+1,frac,p));
  shapes.filter(s=>s.z).forEach((s,i)=>aodShape(s,i*2,frac,p));
 } else {
  shapes.filter(s=>!s.z).forEach(s=>glass(s,shapes,lt-0.2,b,p));
  shapes.filter(s=>s.z).forEach(s=>shadow(s));
  shapes.filter(s=>s.z).forEach((s,i)=>glass(s,shapes,lt+(i?0.2:-0.2),b,p));
 }
 if(p[4]&&!aod)drawStars(ts,p,e,true,minute);
 drawComps(p,e);
 drawClock(now,p,b);
 x.restore();requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
