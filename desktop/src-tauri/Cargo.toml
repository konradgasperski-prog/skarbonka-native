[package]
name = "skarbonka"
version = "1.0.0"
description = "Skarbonka - osobisty budzet, dlugi i statystyki"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
tauri = { version = "1", features = [ "shell-open" ] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# pobieranie nowszej wersji strony z GitHuba (auto-aktualizacje)
ureq = { version = "2", features = ["json"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
