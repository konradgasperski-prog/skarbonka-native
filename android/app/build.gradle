plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.skarbonka.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.skarbonka.app"
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "1.2"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'

    // Aparat (podglad na zywo + analiza klatek)
    def camerax = '1.3.4'
    implementation "androidx.camera:camera-core:$camerax"
    implementation "androidx.camera:camera-camera2:$camerax"
    implementation "androidx.camera:camera-lifecycle:$camerax"
    implementation "androidx.camera:camera-view:$camerax"

    // Odczyt tekstu z paragonu - model wbudowany w apke, dziala bez internetu
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    // Kod QR z paragonu (np. VMI kvitas.vmi.lt) - model wbudowany, offline
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
}
