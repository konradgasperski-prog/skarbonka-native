name: Build Skarbonka (macOS, Windows, Android)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@1

      # --- Lokalne AI: silnik llama.cpp budowany z oficjalnego kodu zrodlowego ---
      - name: Build AI engine (llama.cpp)
        shell: bash
        run: |
          git clone --depth 1 --branch b5000 https://github.com/ggml-org/llama.cpp llama-src
          cmake -S llama-src -B llama-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_NATIVE=OFF \
            -DLLAMA_CURL=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          cmake --build llama-build --config Release --target llama-server -j 4
          BIN=$(find llama-build -type f \( -name llama-server -o -name llama-server.exe \) | head -1)
          echo "Silnik AI: $BIN"
          test -n "$BIN"
          mkdir -p desktop/src-tauri/llama
          cp "$BIN" desktop/src-tauri/llama/
          chmod +x desktop/src-tauri/llama/* || true
          ls -la desktop/src-tauri/llama

      # --- Lokalne AI: model Qwen 2.5 1.5B (oficjalny, od Qwen) ---
      - name: Download AI model
        shell: bash
        run: |
          mkdir -p desktop/src-tauri/models
          curl -L --fail --retry 3 --retry-delay 5 -o desktop/src-tauri/models/qwen2.5-1.5b-instruct-q4_k_m.gguf \
            https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf
          ls -la desktop/src-tauri/models

      - name: Build desktop app
        working-directory: desktop
        run: tauri build

      - name: Upload macOS build
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: skarbonka-macos
          path: |
            desktop/src-tauri/target/release/bundle/dmg/*.dmg

      - name: Upload Windows build
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: skarbonka-windows
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.6

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: skarbonka-android
          path: android/app/build/outputs/apk/debug/*.apk

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install npm dependencies
        working-directory: ios
        run: npm install

      - name: Sync Capacitor iOS project
        working-directory: ios
        run: npx cap sync ios

      - name: Install CocoaPods dependencies
        working-directory: ios/App
        run: pod install

      - name: Build unsigned .app for the iOS Simulator
        working-directory: ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App \
            -sdk iphonesimulator -configuration Debug \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build

      - name: Zip the built app
        working-directory: ios/App/build/Build/Products/Debug-iphonesimulator
        run: zip -r App-simulator.zip App.app

      - name: Upload iOS Simulator build
        uses: actions/upload-artifact@v4
        with:
          name: skarbonka-ios-simulator
          path: ios/App/build/Build/Products/Debug-iphonesimulator/App-simulator.zip
